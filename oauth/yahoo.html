<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReceiptVault AI - Connecting...</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 60px 20px; background: #f5f5f7; }
        .card { background: white; border-radius: 20px; padding: 40px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top: 4px solid #7c3aed; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success { color: #22c55e; font-size: 48px; }
    </style>
    <script>
        // Extract the auth code from URL and redirect back to the app
        window.onload = function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            if (code) {
                // Redirect to app via custom URL scheme
                document.getElementById('status').innerHTML = '<div class="success">✓</div><h2>Connected!</h2><p>Returning to ReceiptVault AI...</p>';
                window.location.href = 'com.satish.ReceiptVault://oauth/yahoo?code=' + encodeURIComponent(code);
                // Fallback message if redirect doesn't work
                setTimeout(function() {
                    document.getElementById('status').innerHTML += '<p style="margin-top:20px;font-size:14px;color:#999;">If the app didn\'t open, copy this code and paste it in the app:<br><strong style="color:#333;user-select:all;">' + code + '</strong></p>';
                }, 3000);
            } else {
                var error = params.get('error');
                document.getElementById('status').innerHTML = '<h2>Connection Failed</h2><p>' + (error || 'No authorization code received.') + '</p><p>Please close this page and try again in the app.</p>';
            }
        };
    </script>
</head>
<body>
    <div class="card" id="status">
        <div class="spinner"></div>
        <h2>Connecting to Yahoo...</h2>
        <p>Please wait while we complete the connection.</p>
    </div>
</body>
</html>
